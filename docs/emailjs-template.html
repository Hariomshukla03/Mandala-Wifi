<h2>New Mandala Broadband enquiry</h2>
<table cellpadding="8" style="border-collapse:collapse;font-family:Arial,sans-serif;color:#17345a">
  <tr><th align="left">Name</th><td>{{name}}</td></tr>
  <tr><th align="left">Mobile</th><td>{{mobile}}</td></tr>
  <tr><th align="left">Email</th><td>{{email}}</td></tr>
  <tr><th align="left">Area</th><td>{{area}}</td></tr>
  <tr><th align="left">Pincode</th><td>{{pincode}}</td></tr>
  <tr><th align="left">Service</th><td>{{service}}</td></tr>
  <tr><th align="left">Preferred plan</th><td>{{plan}}</td></tr>
  <tr><th align="left">Submitted</th><td>{{submitted_at}}</td></tr>
</table>
<h3>Message</h3>
<p style="white-space:pre-wrap">{{message}}</p>
